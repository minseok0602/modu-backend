plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
	implementation 'com.google.firebase:firebase-admin:9.9.0'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	runtimeOnly 'com.mysql:mysql-connector-j'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Isolated, opt-in MySQL experiments. Does not boot production integrations or
// require the unrelated legacy SpringBootTest environment.
sourceSets {
	experiment {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
configurations {
	experimentImplementation.extendsFrom testImplementation
	experimentRuntimeOnly.extendsFrom testRuntimeOnly
	experimentCompileOnly.extendsFrom compileOnly
	experimentAnnotationProcessor.extendsFrom annotationProcessor
}
tasks.register('routeExperiment', Test) {
	description = 'Run isolated route transaction correctness and resource experiments'
	group = 'verification'
	testClassesDirs = sourceSets.experiment.output.classesDirs
	classpath = sourceSets.experiment.runtimeClasspath
	useJUnitPlatform()
	maxParallelForks = 1
	systemProperties System.properties.findAll { key, value -> key.toString().startsWith('ieum.') }
	outputs.upToDateWhen { false }
	testLogging { events 'passed', 'failed'; showStandardStreams = true }
}
